name: Post-deploy smoke test

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event.deployment_status.state == 'success' && endsWith(github.event.deployment.environment, ' / production') && github.event.deployment.creator.login == 'railway-app[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check liveness and readiness
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_URL }}/health"
          curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_URL }}/ready"
